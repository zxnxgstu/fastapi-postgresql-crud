name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_shop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_shop_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_shop_db
    TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_shop_db
    JWT_SECRET_KEY: "test-secret-key-for-github-actions"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v